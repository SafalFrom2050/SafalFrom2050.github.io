<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play AI Game | alt games portal</title>
  <meta name="description" content="Play a community-created AI game on alt games portal.">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png?v=20260908">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png?v=20260908">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png?v=20260908">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ai-games/style.css">
  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script type="module" src="/ai-games/page.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="alt games portal home">
      <span class="brand-logo" aria-hidden="true"><span class="sprite-icon"></span></span>
      <span class="brand-name"><span class="brand-alt">alt</span> <span class="brand-games">games portal</span></span>
    </a>
    <a class="explore" href="/bio/">Explore AI games <span aria-hidden="true">↗</span></a>
  </header>
  <main>
    <div class="game-heading">
    <p class="eyebrow">COMMUNITY AI GAME</p>
    <h1 id="title">Opening your game…</h1>
    </div>
    <p id="status" role="status" aria-live="polite">Loading game details…</p>
    <button id="retry" hidden>Try again</button>
    <article id="details" hidden>
      <div class="preview"><img id="preview" alt="Game preview" hidden><span id="placeholder">AI GAME</span></div>
      <div class="info">
        <p id="category" class="eyebrow"></p>
        <p id="description"></p>
        <div class="game-actions">
          <button id="play"><span aria-hidden="true">▶</span> Play game</button>
          <a id="android-download" class="download-button" href="https://play.google.com/store/apps/details?id=dif.instantgames" hidden><span aria-hidden="true">↓</span> Download app for Android</a>
        </div>
        <p class="hint">Some games need device features available only in the Android app.</p>
      </div>
    </article>
    <section id="player" hidden aria-label="Game player">
      <div class="controls"><button id="stop">Close game</button><button id="fullscreen" aria-pressed="false">Expand game</button></div>
      <div id="frame-host"></div>
    </section>
  </main>
</body>
</html>
