<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play AI Game | alt games portal</title>
  <meta name="description" content="Play a community-created AI game on alt games portal.">
  <link rel="icon" href="/images/favicon-rounded.png">
  <link rel="stylesheet" href="/ai-games/style.css">
  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script type="module" src="/ai-games/page.js"></script>
</head>
<body>
  <header><a href="/">alt games portal</a><a href="/bio/">Explore AI games</a></header>
  <main>
    <p class="eyebrow">COMMUNITY AI GAME</p>
    <h1 id="title">Opening your game…</h1>
    <p id="status" role="status" aria-live="polite">Loading game details…</p>
    <button id="retry" hidden>Try again</button>
    <article id="details" hidden>
      <div class="preview"><img id="preview" alt="Game preview" hidden><span id="placeholder">AI GAME</span></div>
      <div class="info">
        <p id="category" class="eyebrow"></p>
        <p id="description"></p>
        <button id="play">Play game</button>
        <p class="hint">Some games need device features available only in the Android app.</p>
      </div>
    </article>
    <section id="player" hidden aria-label="Game player">
      <div class="controls"><button id="stop">Close game</button><button id="fullscreen">Full screen</button></div>
      <div id="frame-host"></div>
    </section>
  </main>
</body>
</html>
